name: Build AppImage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04   # older glibc, so the AppImage runs on more distros
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # flutter_rust_bridge builds rust/ through cargokit during `flutter build`.
      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv \
            file desktop-file-utils imagemagick

      - name: Packaging tools
        run: |
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -sSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x appimagetool.AppImage linuxdeploy.AppImage

      - name: Dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Check the bundle
        run: |
          ls -la build/linux/x64/release/bundle build/linux/x64/release/bundle/lib
          ldd build/linux/x64/release/bundle/beatwave | grep "not found" || echo "no missing libs"

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          BUNDLE=build/linux/x64/release/bundle
          APPDIR="$PWD/BeatWave.AppDir"

          # Keep the Flutter bundle together: the binary finds lib/ and data/ next to itself.
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib"
          cp -a "$BUNDLE/." "$APPDIR/usr/bin/"

          # AppRun: media_kit opens libmpv by name at runtime, so the bundled
          # library folders have to be on the search path.
          cat > AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/bin/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/beatwave" "$@"
          EOF
          chmod +x AppRun

          cat > beatwave.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=BeatWave
          Comment=Local and plugin-first streaming music player
          Exec=beatwave
          Icon=beatwave
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          EOF

          # linuxdeploy only accepts standard icon sizes; the source is 1024x1024.
          convert assets/icons/BeatWave_Logo_back_4.png -resize 512x512 beatwave.png
          file beatwave.png

          # libmpv is loaded with dlopen, so nothing links to it and linuxdeploy
          # would never find it. Hand it over explicitly with its dependencies.
          LIBS=""
          for f in /usr/lib/x86_64-linux-gnu/libmpv.so.[0-9]*; do
            LIBS="$LIBS --library $f"
          done
          echo "bundling:$LIBS"

          APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/beatwave" \
            $LIBS \
            --desktop-file beatwave.desktop \
            --icon-file beatwave.png \
            --icon-filename beatwave \
            --custom-apprun AppRun

          ls "$APPDIR/usr/lib" | head -50

      - name: Wrap into an AppImage
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          mkdir -p dist
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage \
            BeatWave.AppDir "dist/BeatWave-${VERSION}-linux-x86_64.AppImage"
          ls -lh dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BeatWave-AppImage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
